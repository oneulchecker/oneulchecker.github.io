<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>오늘체커 | 오늘의 이슈·생활정보</title>
<style>
  :root{
    --bg:#fff7f4; --card:#ffffff; --text:#26201e; --muted:#8a7d78;
    --accent:#e8543f; --accent-soft:#fdeae6; --line:#f0ddd7;
  }
  *{box-sizing:border-box;margin:0;padding:0;letter-spacing:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:28px 16px 48px;
  }
  .wrap{max-width:460px;margin:0 auto}
  .profile{text-align:center;margin-bottom:22px}
  .avatar{
    width:76px;height:76px;border-radius:50%;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;font-size:34px;
    margin:0 auto 12px;border:2px solid var(--accent);
  }
  h1{font-size:19px;font-weight:800}
  .bio{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
  .section-label{
    font-size:12px;font-weight:700;color:var(--muted);
    margin:20px 4px 8px;display:flex;align-items:center;gap:6px;
  }
  .links{display:grid;gap:10px}
  a.card{
    display:block;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:15px 16px;text-decoration:none;color:var(--text);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  a.card:active{transform:scale(.98)}
  a.card .title{font-size:14.5px;font-weight:700;line-height:1.45;word-break:keep-all}
  a.card .date{font-size:11.5px;color:var(--muted);margin-top:5px}
  a.card.latest{
    border:2px solid var(--accent);background:linear-gradient(180deg,#fff,#fff9f7);
    box-shadow:0 4px 14px rgba(232,84,63,.12);
  }
  .badge{
    display:inline-block;background:var(--accent);color:#fff;font-size:10.5px;
    font-weight:800;border-radius:99px;padding:2.5px 9px;margin-bottom:7px;
  }
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:30px}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="profile">
    <div class="avatar">📋</div>
    <h1>오늘체커</h1>
    <p class="bio">오늘 알아야 할 정보만 빠르게 체크<br>생활 · 정책 · 지원금 · 이슈 정리</p>
  </div>

  <div class="section-label">🔥 최신 글</div>
  <div class="links" id="links"><div class="empty">글을 불러오는 중…</div></div>

  <p class="foot">오늘체커 · 매일 업데이트</p>
</div>
<script>
fetch('links.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const box = document.getElementById('links');
    if (!data.posts || !data.posts.length) {
      box.innerHTML = '<div class="empty">아직 등록된 글이 없습니다</div>';
      return;
    }
    box.innerHTML = data.posts.map((p, i) => `
      <a class="card ${i === 0 ? 'latest' : ''}" href="${p.url}" target="_blank" rel="noopener">
        ${i === 0 ? '<span class="badge">NEW</span>' : ''}
        <div class="title">${p.title}</div>
        <div class="date">${p.date || ''}</div>
      </a>`).join('');
  })
  .catch(() => {
    document.getElementById('links').innerHTML = '<div class="empty">잠시 후 다시 확인해주세요</div>';
  });
</script>
</body>
</html>
